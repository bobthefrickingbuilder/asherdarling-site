<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Asher Darling</title>
  <meta name="description" content="Contact Asher Darling, pianist, composer and singer-songwriter based in Ottawa.">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
  <link rel="stylesheet" href="styles.css?v=14">
  <script>document.documentElement.classList.add('js')</script>
  <script src="site.js?v=5" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <nav class="site-nav site-nav--solid" aria-label="Main">
    <a class="site-nav__home" href="index.html"><svg class="site-nav__logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><rect x="1" y="1" width="62" height="62" rx="12" fill="var(--bg)" stroke="var(--line-strong)" stroke-width="2"/><rect x="10" y="50" width="44" height="3" fill="var(--amber)"/><text x="32" y="42" text-anchor="middle" font-family="'Young Serif', Georgia, serif" font-size="28" fill="var(--cream)">AD</text></svg><span>Asher Darling</span></a>
    <ul class="site-nav__list">
      <!-- Listen is hidden from the nav until it has content. Restore: <li><a href="listen.html">Listen</a></li> -->
      <li><a href="events.html">Events</a></li>
      <li><a href="pictures.html">Pictures</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </nav>

  <main id="main">
    <header class="page-head">
      <p class="label">Contact</p>
      <h1 class="page-head__title">Get in touch</h1>
    </header>

    <section class="section" aria-labelledby="details-title">
      <h2 class="label section__label" id="details-title">Details</h2>
      <div class="section__body">
        <!-- TODO: contact details. Replace the placeholder below with public contact info (email, booking agent), e.g.
        <dl class="glance"><div><dt>Email</dt><dd><a href="mailto:hello@example.com">hello@example.com</a></dd></div></dl>
        -->
        <p>For bookings and other inquiries, message Asher on <a href="https://www.instagram.com/asherdarlingmusic/" target="_blank" rel="noopener">Instagram<span class="visually-hidden"> (opens in a new tab)</span></a>.</p>
      </div>
    </section>

    <!-- Form is hidden until it has a working endpoint: remove the hidden attribute once it does. -->
    <section class="section" aria-labelledby="form-title" hidden>
      <h2 class="label section__label" id="form-title">Send a message</h2>
      <div class="section__body">
        <!-- TODO: form endpoint. Use FormSubmit: set the action to https://formsubmit.co/ followed by the public email.
             The first submission sends a one-time activation email that must be confirmed. -->
        <form class="form" action="https://formsubmit.co/EMAIL_GOES_HERE" method="POST">
          <div class="field">
            <label class="field__label" for="name">Name</label>
            <input class="input" id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label class="field__label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field__label" for="topic">About</label>
            <select class="input input--select" id="topic" name="topic">
              <option>Booking</option>
              <option>Something else</option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="message">Message</label>
            <textarea class="input" id="message" name="message" rows="6" required></textarea>
          </div>
          <input type="text" name="_gotcha" class="visually-hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="button" type="submit">Send message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__name"><a href="index.html">Asher Darling</a></p>
    <p class="label footer__meta"><a href="contact.html">Contact</a> · © 2026 · Ottawa</p>
  </footer>
</body>
</html>
